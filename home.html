<!DOCTYPE html>

  <title>Nihongo · Bengali — Japanese for Bengali speakers</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('nihongo_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        var f = localStorage.getItem('nihongo_furigana');
        if (f) document.documentElement.setAttribute('data-furigana', f);
        var l = localStorage.getItem('nihongo_lang');
        if (l) document.documentElement.setAttribute('lang', l === 'bn' ? 'bn' : 'en');
      } catch (e) {}
    })();
  </script>
