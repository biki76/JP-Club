<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Nihongo</title>

<script>
(function(){
  var t = localStorage.getItem('nihongo_theme') || 'light';
  var l = localStorage.getItem('nihongo_lang') || 'en';
  document.documentElement.classList.toggle('dark', t === 'dark');
  document.documentElement.setAttribute('data-en', l === 'en' ? '' : '0');
  document.documentElement.setAttribute('data-bn', l === 'bn' ? '' : '0');
  document.documentElement.lang = l;
})();
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
  <aside class="auth-brand">
    <div class="auth-brand-inner">
      <div class="auth-logo">に</div>
      <h1>Learn Japanese, in বাংলা</h1>
      <p>Minna no Nihongo · Kanji · Mimikara · Shin Kanzen</p>
    </div>
  </aside>

  <main class="auth-form-wrap">
    <div class="auth-card">

      <div class="auth-tabs">
        <button class="auth-tab is-active" data-tab="signin">Sign in</button>
        <button class="auth-tab" data-tab="signup">Create account</button>
      </div>

      <div class="auth-social">
        <button type="button" class="auth-social-btn auth-facebook" data-provider="facebook">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13.5 21v-7.5h2.5l.5-3h-3V8.5c0-.9.25-1.5 1.5-1.5H17V4.3c-.3-.04-1.3-.13-2.45-.13-2.4 0-4.05 1.47-4.05 4.17V10.5H8v3h2.5V21h3z"/></svg>
          <span>Continue with Facebook</span>
        </button>
        <button type="button" class="auth-social-btn auth-google" data-provider="google">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21.35 12.19c0-.82-.07-1.61-.2-2.37H12v4.48h5.23a4.48 4.48 0 0 1-1.94 2.94v2.43h3.13c1.83-1.68 2.93-4.16 2.93-7.48z"/><path fill="currentColor" d="M12 22c2.61 0 4.8-.87 6.4-2.35l-3.13-2.43c-.87.58-1.98.93-3.27.93-2.51 0-4.64-1.7-5.4-3.98H3.38v2.51A9.99 9.99 0 0 0 12 22z"/><path fill="currentColor" d="M6.6 14.17a5.97 5.97 0 0 1 0-4.34V7.32H3.38a10 10 0 0 0 0 9.36l3.22-2.51z"/><path fill="currentColor" d="M12 5.85c1.42 0 2.69.49 3.69 1.44l2.76-2.76A9.96 9.96 0 0 0 12 2 9.99 9.99 0 0 0 3.38 7.32L6.6 9.83C7.36 7.55 9.49 5.85 12 5.85z"/></svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div class="auth-divider">or</div>

      <!-- SIGN IN -->
      <form id="form-signin" class="auth-form">
        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" required>
        </label>
        <label class="auth-field">
          <span>Password</span>
          <input type="password" name="password" required minlength="6">
        </label>
        <div class="auth-row">
          <label class="auth-check">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <button type="button" id="btn-magic" class="auth-link">Email me a magic link</button>
        </div>
        <button type="submit" class="auth-submit">Sign in</button>
        <p class="auth-msg" role="status"></p>
      </form>

      <!-- SIGN UP -->
      <form id="form-signup" class="auth-form" style="display:none">

        <ol class="auth-steps">
          <li class="auth-step is-active" data-step="1"><span>1</span><small>Account</small></li>
          <li class="auth-step" data-step="2"><span>2</span><small>About you</small></li>
          <li class="auth-step" data-step="3"><span>3</span><small>Nihongo level</small></li>
        </ol>

        <fieldset class="auth-pane" data-pane="1">
          <label class="auth-field">
            <span>Email</span>
            <input type="email" name="email" required>
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input type="password" name="password" required minlength="6">
            <small>At least 6 characters</small>
          </label>
          <label class="auth-field">
            <span>Confirm password</span>
            <input type="password" name="password2" required minlength="6">
          </label>
        </fieldset>

        <fieldset class="auth-pane" data-pane="2" style="display:none">
          <label class="auth-field">
            <span>Display name</span>
            <input type="text" name="display_name" required>
          </label>
          <label class="auth-field">
            <span>Date of birth</span>
            <input type="date" name="date_of_birth" required>
          </label>
          <label class="auth-field">
            <span>Gender</span>
            <select name="gender" required>
              <option value="">—</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="non_binary">Non-binary</option>
              <option value="prefer_not_to_say">Prefer not to say</option>
            </select>
          </label>
        </fieldset>

        <fieldset class="auth-pane" data-pane="3" style="display:none">
          <label class="auth-field">
            <span>Your Nihongo level</span>
            <select name="nihongo_level" required>
              <option value="">—</option>
              <option value="absolute_beginner">Absolute beginner</option>
              <option value="n5">N5</option>
              <option value="n4">N4</option>
              <option value="n3">N3</option>
              <option value="n2">N2</option>
              <option value="n1">N1</option>
            </select>
          </label>
          <label class="auth-field">
            <span>Learning goal (optional)</span>
            <textarea name="learning_goal" rows="3" maxlength="240"></textarea>
          </label>
        </fieldset>

        <div class="auth-step-nav">
          <button type="button" class="auth-back" style="display:none">Back</button>
          <button type="button" class="auth-next">Next</button>
          <button type="submit" class="auth-submit" style="display:none">Create account</button>
        </div>
        <p class="auth-msg" role="status"></p>
      </form>

    </div>
    <p class="auth-foot">By continuing you agree to our Terms.</p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/auth-ui.js"></script>
</body>
</html>
