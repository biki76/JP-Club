<!DOCTYPE html>
<html lang="en" data-theme="light" data-furigana="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · JP-Club</title>
  <meta name="robots" content="noindex" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('nihongo_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        var f = localStorage.getItem('nihongo_furigana');
        if (f) document.documentElement.setAttribute('data-furigana', f);
        var l = localStorage.getItem('nihongo_lang');
        if (l) document.documentElement.setAttribute('lang', l === 'bn' ? 'bn' : 'en');
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/a11y.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="auth-brand" href="home.html">
      <span class="auth-brand__mark" aria-hidden="true">日</span>
      <span>JP-Club</span>
    </a>

    <div class="auth-card">
      <header class="auth-card__head">
        <h1 id="auth-title"><span data-en="Sign in" data-bn="সাইন ইন">Sign in</span></h1>
        <p class="auth-card__sub">
          <span data-en="Sync lessons, streaks, flashcards, and quiz history across devices."
                data-bn="পাঠ, স্ট্রিক, ফ্ল্যাশকার্ড এবং কুইজ ইতিহাস সব ডিভাইসে সিঙ্ক করুন।">Sync lessons, streaks, flashcards, and quiz history across devices.</span>
        </p>
      </header>

      <div class="auth-tabs" role="tablist" aria-label="Auth mode">
        <button role="tab" id="tab-in" aria-selected="true"  aria-controls="panel-in" class="auth-tab is-active" data-mode="in">
          <span data-en="Sign in" data-bn="সাইন ইন">Sign in</span>
        </button>
        <button role="tab" id="tab-up" aria-selected="false" aria-controls="panel-up" class="auth-tab" data-mode="up" tabindex="-1">
          <span data-en="Create account" data-bn="অ্যাকাউন্ট তৈরি">Create account</span>
        </button>
      </div>

      <div id="auth-alert" class="auth-alert" role="alert" hidden></div>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="field">
          <span class="field__label"><span data-en="Email" data-bn="ইমেইল">Email</span></span>
          <input class="input" id="auth-email" type="email" autocomplete="email" required />
        </label>

        <label class="field">
          <span class="field__label"><span data-en="Password" data-bn="পাসওয়ার্ড">Password</span></span>
          <input class="input" id="auth-password" type="password" autocomplete="current-password" minlength="6" required />
        </label>

        <button class="btn btn--primary btn--lg auth-submit" id="auth-submit" type="submit">
          <span data-en="Sign in" data-bn="সাইন ইন">Sign in</span>
        </button>
      </form>

      <div class="auth-divider" aria-hidden="true"><span>or</span></div>

      <div class="auth-alt">
        <button class="btn btn--secondary" id="auth-magic" type="button">
          <span data-en="Email me a magic link" data-bn="আমাকে ম্যাজিক লিংক ইমেইল করুন">Email me a magic link</span>
        </button>
        <button class="btn btn--secondary" id="auth-google" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45 24c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.3 6.6v5.5h7c4.1-3.8 6.5-9.4 6.5-16.1z"/>
            <path fill="#34A853" d="M24 45c5.8 0 10.7-1.9 14.2-5.2l-7-5.5c-1.9 1.3-4.4 2.1-7.2 2.1-5.5 0-10.2-3.7-11.9-8.7H4.7v5.6C8.3 40.3 15.5 45 24 45z"/>
            <path fill="#FBBC05" d="M12.1 27.7c-.4-1.3-.7-2.6-.7-4s.2-2.7.7-4v-5.6H4.7C3.2 17.1 2.3 20.5 2.3 24s.9 6.9 2.4 9.9l7.4-6.2z"/>
            <path fill="#EA4335" d="M24 10.5c3.1 0 5.9 1.1 8.1 3.1l6.1-6.1C34.7 4.1 29.8 2 24 2 15.5 2 8.3 6.7 4.7 13.4l7.4 5.6C13.8 14.2 18.5 10.5 24 10.5z"/>
          </svg>
          <span data-en="Continue with Google" data-bn="Google দিয়ে চালিয়ে যান">Continue with Google</span>
        </button>
      </div>

      <p class="auth-foot">
        <button type="button" class="auth-link" id="auth-forgot">
          <span data-en="Forgot password?" data-bn="পাসওয়ার্ড ভুলে গেছেন?">Forgot password?</span>
        </button>
        <span class="auth-foot__sep">·</span>
        <a class="auth-link" href="home.html">
          <span data-en="Continue without an account" data-bn="অ্যাকাউন্ট ছাড়া চালিয়ে যান">Continue without an account</span>
        </a>
      </p>

      <p class="auth-note">
        <span data-en="Your data stays on this device until you sign in. Signing in merges local progress into your account."
              data-bn="সাইন ইন করার আগ পর্যন্ত আপনার ডেটা এই ডিভাইসে থাকে। সাইন ইন করলে স্থানীয় অগ্রগতি আপনার অ্যাকাউন্টে যুক্ত হবে।">Your data stays on this device until you sign in. Signing in merges local progress into your account.</span>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-config.js" defer></script>
  <script src="js/cloud.js" defer></script>
  <script src="js/auth-ui.js" defer></script>
</body>
</html>
