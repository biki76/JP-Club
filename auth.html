<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en="Sign in · JP-Club" data-bn="সাইন ইন · JP-Club">Sign in · JP-Club</title>
<meta name="description" content="Sign in or create your Nihongo account.">

<!-- Pre-paint (theme/lang) -->
<script>
(function(){
  var r = document.documentElement;
  var t = localStorage.getItem('nihongo_theme') || 'light';
  var l = localStorage.getItem('nihongo_lang') || 'en';
  if (t === 'dark') r.setAttribute('data-theme', 'dark');
  r.lang = l;
})();
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/a11y.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="slimo" viewBox="0 0 120 124">
    <ellipse cx="60" cy="114" rx="40" ry="5" fill="#351a6b" opacity=".16"/>
    <path d="M18 98C18 98 26 64 44 44C50 38 54 32 60 32C66 32 70 38 76 44C94 64 102 98 102 98C102 105 94 107 60 107C26 107 18 105 18 98Z" fill="#a96cf5"/>
    <path d="M18 98C18 105 26 107 60 107C94 107 102 105 102 98C102 93 94 95 60 95C26 95 18 93 18 98Z" fill="#8a55c9"/>
    <path d="M60 32V20" stroke="#a96cf5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="14" r="7" fill="#c08cff"/>
    <ellipse cx="44" cy="60" rx="5" ry="3" transform="rotate(-35 44 60)" fill="#fff" opacity=".5"/>
    <circle cx="48" cy="76" r="5" fill="#351a6b"/><circle cx="72" cy="76" r="5" fill="#351a6b"/>
    <circle cx="46.5" cy="74.5" r="1.6" fill="#fff"/><circle cx="70.5" cy="74.5" r="1.6" fill="#fff"/>
    <ellipse cx="37" cy="86" rx="7" ry="4.5" fill="#ffa8dd"/><ellipse cx="83" cy="86" rx="7" ry="4.5" fill="#ffa8dd"/>
    <ellipse cx="60" cy="87" rx="3" ry="2.4" fill="#351a6b"/>
  </symbol>
</svg>

<div class="auth-shell">
  <!-- Brand column -->
  <aside class="auth-brand" aria-hidden="true">
    <div class="auth-brand-inner">
      <div class="auth-bubble" data-en="Hi! I'm Slimo 👋" data-bn="হ্যালো! আমি স্লিমো 👋">Hi! I'm Slimo 👋</div>
      <svg class="auth-slimo" viewBox="0 0 120 124"><use href="#slimo"/></svg>
      <h1 data-en="Learn Japanese, in বাংলা" data-bn="বাংলায় জাপানিজ শিখুন">Learn Japanese, in বাংলা</h1>
      <p data-en="Minna no Nihongo · Kanji · Mimikara · Shin Kanzen"
         data-bn="মিন্না নো নিহঙ্গো · কানজি · মিমিকারা · শিন কানজেন">Minna no Nihongo · Kanji · Mimikara · Shin Kanzen</p>
    </div>
  </aside>

  <!-- Form column -->
  <main class="auth-form-wrap">
    <div class="auth-card">
      <header class="auth-head">
        <a class="auth-home" href="home.html" aria-label="JP-Club">
          <span class="auth-mark" aria-hidden="true">日</span><span class="auth-name">JP-Club</span>
        </a>
        <div class="auth-tools">
          <button type="button" id="auth-lang" class="auth-tool" aria-label="Language">বাং</button>
          <button type="button" id="auth-theme" class="auth-tool" aria-label="Dark mode">◐</button>
        </div>
      </header>
      <div class="auth-hello">
        <svg class="auth-slimo-sm" viewBox="0 0 120 124" aria-hidden="true"><use href="#slimo"/></svg>
        <div>
          <p class="auth-hello-title" data-en="Welcome to JP-Club" data-bn="JP-Club-এ স্বাগতম">Welcome to JP-Club</p>
          <p class="auth-hello-sub" data-en="Save your progress and learn on any device." data-bn="আপনার অগ্রগতি সংরক্ষণ করুন, যেকোনো ডিভাইসে শিখুন।">Save your progress and learn on any device.</p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="signin"
                data-en="Sign in" data-bn="সাইন ইন">Sign in</button>
        <button role="tab" aria-selected="false" data-tab="signup"
                data-en="Create account" data-bn="অ্যাকাউন্ট তৈরি করুন">Create account</button>
      </div>

      <!-- Social buttons -->
      <div class="auth-social">
        <button type="button" class="auth-social-btn auth-facebook"
                data-provider="facebook"
                data-aria-label-en="Continue with Facebook"
                data-aria-label-bn="ফেসবুক দিয়ে চালিয়ে যান">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 21v-7.5h2.5l.5-3h-3V8.5c0-.9.25-1.5 1.5-1.5H17V4.3c-.3-.04-1.3-.13-2.45-.13-2.4 0-4.05 1.47-4.05 4.17V10.5H8v3h2.5V21h3z"/></svg>
          <span data-en="Continue with Facebook" data-bn="ফেসবুক দিয়ে চালিয়ে যান">Continue with Facebook</span>
        </button>
        <button type="button" class="auth-social-btn auth-google"
                data-provider="google"
                data-aria-label-en="Continue with Google"
                data-aria-label-bn="গুগল দিয়ে চালিয়ে যান">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 12.19c0-.82-.07-1.61-.2-2.37H12v4.48h5.23a4.48 4.48 0 0 1-1.94 2.94v2.43h3.13c1.83-1.68 2.93-4.16 2.93-7.48z"/><path fill="currentColor" d="M12 22c2.61 0 4.8-.87 6.4-2.35l-3.13-2.43c-.87.58-1.98.93-3.27.93-2.51 0-4.64-1.7-5.4-3.98H3.38v2.51A9.99 9.99 0 0 0 12 22z"/><path fill="currentColor" d="M6.6 14.17a5.97 5.97 0 0 1 0-4.34V7.32H3.38a10 10 0 0 0 0 9.36l3.22-2.51z"/><path fill="currentColor" d="M12 5.85c1.42 0 2.69.49 3.69 1.44l2.76-2.76A9.96 9.96 0 0 0 12 2 9.99 9.99 0 0 0 3.38 7.32L6.6 9.83C7.36 7.55 9.49 5.85 12 5.85z"/></svg>
          <span data-en="Continue with Google" data-bn="গুগল দিয়ে চালিয়ে যান">Continue with Google</span>
        </button>
      </div>

      <div class="auth-divider" data-en="or" data-bn="অথবা">or</div>

      <!-- SIGN IN form -->
      <form id="form-signin" class="auth-form" novalidate>
        <label class="auth-field">
          <span data-en="Email" data-bn="ইমেইল">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span data-en="Password" data-bn="পাসওয়ার্ড">Password</span>
          <input type="password" name="password" autocomplete="current-password" required minlength="6">
        </label>
        <div class="auth-row">
          <label class="auth-check">
            <input type="checkbox" name="remember">
            <span data-en="Remember me" data-bn="আমাকে মনে রাখুন">Remember me</span>
          </label>
          <button type="button" id="btn-magic" class="auth-link"
                  data-en="Email me a magic link" data-bn="ম্যাজিক লিংক ইমেইল করুন">Email me a magic link</button>
        </div>
        <button type="submit" class="auth-submit" data-en="Sign in" data-bn="সাইন ইন">Sign in</button>
        <p class="auth-msg" role="status" aria-live="polite"></p>
      </form>

      <!-- SIGN UP form (multi-step) -->
      <form id="form-signup" class="auth-form auth-form--hidden" novalidate>

        <!-- Step indicator -->
        <ol class="auth-steps" aria-label="Signup progress">
          <li class="auth-step is-active" data-step="1"><span>1</span><small data-en="Account" data-bn="অ্যাকাউন্ট">Account</small></li>
          <li class="auth-step" data-step="2"><span>2</span><small data-en="About you" data-bn="আপনার সম্পর্কে">About you</small></li>
          <li class="auth-step" data-step="3"><span>3</span><small data-en="Nihongo level" data-bn="নিহঙ্গো লেভেল">Nihongo level</small></li>
        </ol>

        <!-- Step 1: credentials -->
        <fieldset class="auth-step-pane" data-pane="1">
          <label class="auth-field">
            <span data-en="Email" data-bn="ইমেইল">Email</span>
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label class="auth-field">
            <span data-en="Password" data-bn="পাসওয়ার্ড">Password</span>
            <input type="password" name="password" autocomplete="new-password" required minlength="6">
            <small data-en="At least 6 characters" data-bn="কমপক্ষে ৬টি অক্ষর">At least 6 characters</small>
          </label>
          <label class="auth-field">
            <span data-en="Confirm password" data-bn="পাসওয়ার্ড নিশ্চিত করুন">Confirm password</span>
            <input type="password" name="password2" autocomplete="new-password" required minlength="6">
          </label>
        </fieldset>

        <!-- Step 2: personal -->
        <fieldset class="auth-step-pane auth-step-pane--hidden" data-pane="2">
          <label class="auth-field">
            <span data-en="Display name" data-bn="প্রদর্শন নাম">Display name</span>
            <input type="text" name="display_name" autocomplete="name" required>
          </label>
          <label class="auth-field">
            <span data-en="Date of birth" data-bn="জন্ম তারিখ">Date of birth</span>
            <input type="date" name="date_of_birth" required>
          </label>
          <label class="auth-field">
            <span data-en="Gender" data-bn="লিঙ্গ">Gender</span>
            <select name="gender" required>
              <option value="">—</option>
              <option value="male" data-en="Male" data-bn="পুরুষ">Male</option>
              <option value="female" data-en="Female" data-bn="নারী">Female</option>
              <option value="non_binary" data-en="Non-binary" data-bn="নন-বাইনারি">Non-binary</option>
              <option value="prefer_not_to_say" data-en="Prefer not to say" data-bn="বলতে চাই না">Prefer not to say</option>
            </select>
          </label>
        </fieldset>

        <!-- Step 3: learning -->
        <fieldset class="auth-step-pane auth-step-pane--hidden" data-pane="3">
          <label class="auth-field">
            <span data-en="Your Nihongo level" data-bn="আপনার নিহঙ্গো লেভেল">Your Nihongo level</span>
            <select name="nihongo_level" required>
              <option value="">—</option>
              <option value="absolute_beginner" data-en="Absolute beginner (start from Lesson 1)" data-bn="একদম শুরু (লেসন ১ থেকে)">Absolute beginner</option>
              <option value="n5" data-en="N5 — basic hiragana/katakana" data-bn="N5 — হিরাগানা/কাতাকানা">N5</option>
              <option value="n4" data-en="N4 — elementary grammar" data-bn="N4 — প্রাথমিক ব্যাকরণ">N4</option>
              <option value="n3" data-en="N3 — intermediate" data-bn="N3 — মধ্যবর্তী">N3</option>
              <option value="n2" data-en="N2 — upper intermediate" data-bn="N2 — উচ্চ মধ্যবর্তী">N2</option>
              <option value="n1" data-en="N1 — advanced" data-bn="N1 — উন্নত">N1</option>
            </select>
          </label>
          <label class="auth-field">
            <span data-en="Learning goal (optional)" data-bn="শেখার লক্ষ্য (ঐচ্ছিক)">Learning goal (optional)</span>
            <textarea name="learning_goal" rows="3" maxlength="240"
                      data-en-placeholder="e.g. Read manga, pass N3, travel to Japan"
                      data-bn-placeholder="যেমন: মাঙ্গা পড়া, N3 পাস, জাপান ভ্রমণ"></textarea>
          </label>
        </fieldset>

        <div class="auth-step-nav">
          <button type="button" class="auth-back auth-step-nav--hidden" data-en="Back" data-bn="পেছনে">Back</button>
          <button type="button" class="auth-next" data-en="Next" data-bn="পরবর্তী">Next</button>
          <button type="submit" class="auth-submit auth-step-nav--hidden"
                  data-en="Create account" data-bn="অ্যাকাউন্ট তৈরি করুন">Create account</button>
        </div>
        <p class="auth-msg" role="status" aria-live="polite"></p>
      </form>

    </div>
    <p class="auth-foot">
      <span data-en="By continuing you agree to our" data-bn="চালিয়ে গেলে আপনি সম্মত হচ্ছেন আমাদের">By continuing you agree to our</span>
      <a href="terms.html" data-en="Terms" data-bn="শর্তাবলী">Terms</a>
      <span data-en="and" data-bn="ও">and</span>
      <a href="privacy.html" data-en="Privacy Policy" data-bn="গোপনীয়তা নীতি">Privacy Policy</a>.
    </p>
  </main>
</div>

<script>
(function(){
  var R = document.documentElement, D = document;
  function apply(l){
    R.lang = l;
    D.querySelectorAll('[data-en][data-bn]').forEach(function(el){
      if (el === R) return;
      var t = el.getAttribute('data-' + l); if (t !== null) el.textContent = t;
    });
    D.querySelectorAll('[data-en-placeholder]').forEach(function(el){
      el.setAttribute('placeholder', el.getAttribute('data-' + l + '-placeholder') || '');
    });
    D.querySelectorAll('[data-aria-label-en]').forEach(function(el){
      el.setAttribute('aria-label', el.getAttribute('data-aria-label-' + l) || '');
    });
    var b = D.getElementById('auth-lang'); if (b) b.textContent = l === 'bn' ? 'EN' : 'বাং';
    D.title = l === 'bn' ? 'সাইন ইন · JP-Club' : 'Sign in · JP-Club';
  }
  apply(localStorage.getItem('nihongo_lang') || 'en');
  D.getElementById('auth-lang').addEventListener('click', function(){
    var n = R.lang === 'bn' ? 'en' : 'bn';
    try { localStorage.setItem('nihongo_lang', n); } catch(e){}
    apply(n);
  });
  D.getElementById('auth-theme').addEventListener('click', function(){
    var dark = R.getAttribute('data-theme') !== 'dark';
    if (dark) R.setAttribute('data-theme', 'dark'); else R.removeAttribute('data-theme');
    try { localStorage.setItem('nihongo_theme', dark ? 'dark' : 'light'); } catch(e){}
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/cloud.js" defer></script>
  <script src="js/security/sanitize.js" defer></script>
  <script src="js/security/jp-auth.js" defer></script>
<script src="js/auth-ui.js" defer></script>
</body>
</html>
