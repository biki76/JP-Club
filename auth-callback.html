<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-en="Signing in…" data-bn="সাইন ইন হচ্ছে…">Signing in…</title>
<script>
(function(){
  var t = localStorage.getItem('nihongo_theme') || 'light';
  var l = localStorage.getItem('nihongo_lang') || 'en';
  document.documentElement.classList.toggle('dark', t === 'dark');
  document.documentElement.lang = l;
})();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/design-system.css">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:var(--font-en); }
  .spin { width:40px; height:40px; border:3px solid var(--border);
          border-top-color:var(--accent); border-radius:50%; animation:sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .wrap { text-align:center; }
  .err { color:var(--danger,#c0392b); margin-top:1rem; font-size:0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spin"></div>
  <p data-en="Finishing sign in…" data-bn="সাইন ইন শেষ হচ্ছে…">Finishing sign in…</p>
  <p class="err" id="err" hidden></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/cloud.js" defer></script>
<script defer>
window.addEventListener('load', async () => {
  const errEl = document.getElementById('err');
  try {
    const { data: { session }, error } = await window.supabase.auth.getSession();
    if (error) throw error;
    if (!session) { errEl.textContent = 'No session. Try signing in again.'; errEl.hidden = false; return; }

    // If profile row missing, create it from user_metadata (OAuth case)
    const meta = session.user.user_metadata || {};
    const { data: existing } = await window.supabase
      .from('profiles').select('id').eq('id', session.user.id).single();

    if (!existing) {
      await window.supabase.from('profiles').upsert({
        id: session.user.id,
        email: session.user.email,
        display_name: meta.full_name || meta.name || session.user.email,
        updated_at: new Date().toISOString()
      });
    }

    // Restore local prefs and redirect
    localStorage.setItem('nihongo_sync_user', session.user.id);
    if (window.CloudSync) await window.CloudSync.pull();
    window.location.href = new URL('home.html', window.location.href).href;
  } catch (e) {
    errEl.textContent = e.message || 'Something went wrong.';
    errEl.hidden = false;
  }
});
</script>
</body>
</html>
