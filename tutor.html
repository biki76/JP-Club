<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon — AI Tutor</title>
<link rel="stylesheet" href="css/tutor.css">
</head>
<body>
<div class="tutor-app" id="tutorApp" data-state="idle">
  <header class="tutor-header">
    <h1 class="tutor-name">
      Moon
      <span class="tutor-name-jp">ムーン</span>
    </h1>
    <div class="status-pill" id="statusPill" data-state="idle" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text" id="statusText">Idle</span>
    </div>
  </header>

  <main class="tutor-main">
    <section class="avatar-panel" aria-label="Moon avatar">
      <div class="avatar-wrap" id="avatarWrap" data-state="idle">
        <img class="avatar-img" id="moonAvatar" src="assets/moon.png"
             alt="Moon, the AI tutor">
        <div class="avatar-ring" aria-hidden="true"></div>
      </div>
    </section>

    <section class="conversation-panel" aria-label="Conversation">
      <div class="conversation" id="conversation" role="log" aria-live="polite"></div>
      <div class="candidate-area" id="candidateArea"
           aria-label="Suggested replies"></div>
    </section>
  </main>

  <footer class="control-bar">
    <button class="settings-btn" id="settingsBtn" type="button"
            aria-label="Settings">⚙</button>

    <button class="mic-btn" id="micBtn" type="button"
            aria-label="Microphone">
      <span class="mic-icon" aria-hidden="true">●</span>
    </button>

    <button class="furigana-toggle" id="furiganaToggle" type="button"
            aria-pressed="true">ふりがな</button>

    <div class="settings-panel" id="settingsPanel" hidden>
      <label class="setting-row">
        <span>Voice</span>
        <select id="voiceSelect" aria-label="Voice"></select>
      </label>
      <label class="setting-row">
        <span>Speed</span>
        <input id="speedRange" type="range" min="0.6" max="1.4"
               step="0.05" value="1" aria-label="Speed">
      </label>
      <p class="voice-notice" id="voiceNotice" hidden></p>
    </div>
  </footer>
</div>
<script src="js/tutor-voice.js"></script>
</body>
</html>
