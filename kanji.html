<!DOCTYPE html>
<html lang="en" data-theme="light" data-furigana="on">
<head>
  <meta charset="UTF-8" />

  <title>Kanji — Nihongo</title>

  <!-- Pre-paint: apply saved prefs before any CSS loads (FOUC-free) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nihongo_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var f = localStorage.getItem('nihongo_furigana');
        if (f === 'on' || f === 'off') document.documentElement.setAttribute('data-furigana', f);
        var l = localStorage.getItem('nihongo_lang');
        if (l === 'en' || l === 'bn') document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tailwind.css">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/design-system.css" />

  <link rel="stylesheet" href="css/kanji.css" />
  <link rel="stylesheet" href="css/phase13.css">
  <link rel="stylesheet" href="css/theme-v2.css">
</head>
