<body class="shell-body">
  <header data-shell-header></header>

  <div class="shell-frame">
    <aside class="shell-sidebar" data-shell-sidebar></aside>
    <main class="shell-main">
      <article class="lesson" data-lesson>
        <header class="lesson__head" data-lesson-head>
          <div class="lesson__head-main">
            <span class="badge badge--outline" data-lesson-badge>
              <span data-en="Lesson" data-bn="পাঠ">Lesson</span>

            </h1>
            <p class="lesson__subtitle" data-lesson-subtitle></p>
            <div class="lesson__meta" data-lesson-meta></div>
          </div>
          <div class="lesson__actions">
            <button class="ctrl" type="button" data-bookmark aria-pressed="false"
                    data-aria-label-en="Bookmark this lesson" data-aria-label-bn="এই পাঠ বুকমার্ক করুন"
                    aria-label="Bookmark this lesson">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
              </svg>
            </button>
            <button class="ctrl" type="button" data-furigana-local aria-pressed="true"
                    data-aria-label-en="Toggle furigana" data-aria-label-bn="ফুরিগানা চালু/বন্ধ"
                    aria-label="Toggle furigana">
              <span style="font-family:var(--font-jp);font-weight:700">あ</span>
            </button>
            <button class="btn btn--primary btn--sm" type="button" data-complete>
              <span data-en="Mark complete" data-bn="সম্পন্ন চিহ্নিত করুন">Mark complete</span>
            </button>
          </div>
        </header>

        <nav class="tablist lesson__tabs" role="tablist" aria-label="Lesson sections" data-tabs>
          <button class="tab" role="tab" id="tab-vocabulary" aria-controls="panel-vocabulary" aria-selected="true"  data-tab="vocabulary" tabindex="0">
            <span data-en="Vocabulary" data-bn="শব্দভাণ্ডার">Vocabulary</span>
          </button>
          <button class="tab" role="tab" id="tab-grammar"    aria-controls="panel-grammar"    aria-selected="false" data-tab="grammar"    tabindex="-1">
            <span data-en="Grammar" data-bn="ব্যাকরণ">Grammar</span>
          </button>
          <button class="tab" role="tab" id="tab-kanji"      aria-controls="panel-kanji"      aria-selected="false" data-tab="kanji"      tabindex="-1">
            <span data-en="Kanji" data-bn="কাঞ্জি">Kanji</span>
          </button>
          <button class="tab" role="tab" id="tab-reading"    aria-controls="panel-reading"    aria-selected="false" data-tab="reading"    tabindex="-1">
            <span data-en="Reading" data-bn="পড়া">Reading</span>
          </button>
          <button class="tab" role="tab" id="tab-listening"  aria-controls="panel-listening"  aria-selected="false" data-tab="listening"  tabindex="-1">
            <span data-en="Listening" data-bn="শোনা">Listening</span>
          </button>
          <button class="tab" role="tab" id="tab-practice"   aria-controls="panel-practice"   aria-selected="false" data-tab="practice"   tabindex="-1">
            <span data-en="Practice" data-bn="অনুশীলন">Practice</span>
          </button>
        </nav>

        <div class="lesson__panels" data-panels>
          <section class="lesson__panel" role="tabpanel" id="panel-vocabulary" aria-labelledby="tab-vocabulary" data-panel="vocabulary">
            <div class="lesson__toolbar">
              <button class="btn btn--secondary btn--sm" type="button" data-play-all="vocabulary">
                <span data-en="Play all" data-bn="সব শুনুন">Play all</span>
              </button>
            </div>
            <div class="lesson__content" data-content="vocabulary"></div>
          </section>

          <section class="lesson__panel" role="tabpanel" id="panel-grammar" aria-labelledby="tab-grammar" data-panel="grammar" hidden>
            <div class="lesson__toolbar">
              <button class="btn btn--secondary btn--sm" type="button" data-play-all="grammar">
                <span data-en="Play all" data-bn="সব শুনুন">Play all</span>
              </button>
            </div>
            <div class="lesson__content" data-content="grammar"></div>
          </section>

          <section class="lesson__panel" role="tabpanel" id="panel-reading" aria-labelledby="tab-reading" data-panel="reading" hidden>

          <section class="lesson__panel" role="tabpanel" id="panel-practice" aria-labelledby="tab-practice" data-panel="practice" hidden>
            <div class="lesson__content" data-content="practice"></div>
          </section>
        </div>
