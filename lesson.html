<!DOCTYPE html>
<html lang="en" data-theme="light" data-furigana="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson | JP-Club</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nihongo_theme'); if (t) document.documentElement.setAttribute('data-theme', t);
        var f = localStorage.getItem('nihongo_furigana'); if (f) document.documentElement.setAttribute('data-furigana', f);
        var l = localStorage.getItem('nihongo_lang'); if (l) document.documentElement.setAttribute('lang', l === 'bn' ? 'bn' : 'en');
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cloud.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/a11y.css" />
  <link rel="stylesheet" href="css/pwa.css" />
  <link rel="stylesheet" href="css/content-status.css" />
  <style>
    .lv-page { max-width: 860px; display: flex; flex-direction: column; gap: var(--s-5); }
    .lv-crumb a { font-size: var(--fs-sm); font-weight: 600; color: var(--primary); text-decoration: none; }
    .lv-head { display: flex; flex-direction: column; gap: var(--s-2); margin-bottom: var(--s-4); }
    .lv-kicker { margin: 0; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-subtle); }
    .lv-title { margin: 0; font-size: var(--fs-3xl); font-weight: 700; color: var(--ink); line-height: 1.25; }
    html[lang="bn"] .lv-title { line-height: 1.45; }
    .lv-subtitle { margin: 0; font-family: var(--font-jp); color: var(--ink-muted); font-size: var(--fs-lg); }
    .lv-badges { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-2); }
    .lv-panel { min-height: 200px; margin-top: var(--s-4); }
    .lv-list { display: flex; flex-direction: column; gap: var(--s-3); }
    .lv-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); }
    .lv-item:hover { border-color: var(--primary); }
    .lv-jp { margin: 0; font-family: var(--font-jp); font-size: var(--fs-xl); line-height: var(--lh-jp); color: var(--ink); font-weight: 500; }
    .lv-reading { margin: 0; font-family: var(--font-jp); font-size: var(--fs-sm); color: var(--ink-muted); }
    html[data-furigana="off"] .lv-reading { display: none; }
    .lv-romaji { margin: 0; font-size: var(--fs-sm); color: var(--ink-subtle); font-style: italic; }
    .lv-meaning { margin: 0; font-size: var(--fs-md); font-weight: 500; color: var(--ink); }
    .lv-meaning--sm { font-size: var(--fs-sm); font-weight: 400; color: var(--ink-muted); }
    .lv-examples { list-style: none; margin: var(--s-3) 0 0; padding: var(--s-3); border-left: 3px solid var(--primary); background: color-mix(in srgb, var(--primary) 8%, transparent); border-radius: 0 var(--r-sm) var(--r-sm) 0; display: flex; flex-direction: column; gap: var(--s-3); }
    .lv-examples li { display: flex; flex-direction: column; gap: 4px; }
    .lv-kanji-grid { display: grid; gap: var(--s-3); grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .lv-kanji-char { margin: 0; font-family: var(--font-jp); font-size: var(--fs-4xl); line-height: 1.2; color: var(--ink); font-weight: 700; }
    .lv-empty { color: var(--ink-muted); padding: var(--s-6); text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--r-md); }
    .lv-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding-top: var(--s-5); border-top: 1px solid var(--border); margin-top: var(--s-6); }
    .lv-grammar-pattern { font-family: var(--font-jp); font-size: var(--fs-lg); font-weight: 600; color: var(--primary); margin: 0 0 var(--s-1); }
  </style>
  <script>
    window.SHELL_CONFIG = {
      navGroups: [
        { title: { en: 'Learn', bn: 'শিখুন' }, items: [
          { key: 'home', icon: 'home', href: 'home.html', label: { en: 'Home', bn: 'হোম' } },
          { key: 'lesson', icon: 'book', href: 'lessons.html', label: { en: 'Lessons', bn: 'পাঠ' } },
          { key: 'flashcards', icon: 'practice', href: 'flashcards.html', label: { en: 'Flashcards', bn: 'ফ্ল্যাশকার্ড' } },
          { key: 'quiz', icon: 'practice', href: 'quiz.html', label: { en: 'Quiz', bn: 'কুইজ' } },
          { key: 'kanji', icon: 'kanji', href: 'kanji.html', label: { en: 'Kanji', bn: 'কাঞ্জি' } }
        ]},
        { title: { en: 'Explore', bn: 'অন্বেষণ' }, items: [
          { key: 'search', icon: 'search', href: 'search.html', label: { en: 'Search', bn: 'অনুসন্ধান' } },
          { key: 'progress', icon: 'practice', href: 'progress.html', label: { en: 'Progress', bn: 'অগ্রগতি' } },
          { key: 'placement', icon: 'book', href: 'placement.html', label: { en: 'Placement', bn: 'প্লেসমেন্ট' } }
        ]}
      ],
      bottomNav: [
        { href: 'home.html', icon: 'home', label: { en: 'Home', bn: 'হোম' } },
        { href: 'flashcards.html', icon: 'practice', label: { en: 'Cards', bn: 'কার্ড' } },
        { href: 'search.html', icon: 'search', label: { en: 'Search', bn: 'অনুসন্ধান' } },
        { href: 'progress.html', icon: 'practice', label: { en: 'Progress', bn: 'অগ্রগতি' } }
      ],
      searchEnabled: true
    };
  </script>
</head>
<body class="shell-body">
  <header data-shell-header></header>
  <div class="shell-frame">
    <aside class="shell-sidebar" data-shell-sidebar></aside>
    <main class="shell-main">
      <div class="lv-page">
        <nav class="lv-crumb"><a href="lessons.html"><span data-en="← All lessons" data-bn="← সব পাঠ">← All lessons</span></a></nav>
        <header class="lv-head" id="lv-head">
          <p class="lv-kicker" id="lv-kicker"></p>
          <h1 class="lv-title" id="lv-title"></h1>
          <p class="lv-subtitle" id="lv-subtitle"></p>
          <div class="lv-badges" id="lv-badges"></div>
        </header>
        <div class="tablist" role="tablist" id="lv-tabs"></div>
        <section id="lv-panel" class="lv-panel" role="tabpanel"></section>
        <nav class="lv-nav" id="lv-nav"></nav>
      </div>
    </main>
  </div>
  <nav class="shell-bottomnav" data-shell-bottomnav></nav>
  <footer class="shell-footer" data-shell-footer></footer>
  <aside class="shell-drawer" data-shell-drawer data-open="false"></aside>

  <script src="js/data-schemas.js" defer></script>
  <script src="js/data-loader.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-config.js" defer></script>
  <script src="js/cloud.js" defer></script>
  <script src="js/a11y.js" defer></script>
  <script src="js/pwa.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/content-status.js" defer></script>
  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const slug = n => 'minna-' + String(n).padStart(3, '0');
    const lang = () => {
      try { return localStorage.getItem('nihongo_lang') === 'bn' ? 'bn' : 'en'; }
      catch (e) { return 'en'; }
    };
    let state = { n: 1, data: {}, tab: 'vocabulary', slug: null };
    const TABS = [
      { id: 'vocabulary', en: 'Vocabulary', bn: 'শব্দভাণ্ডার' },
      { id: 'grammar',    en: 'Grammar',    bn: 'ব্যাকরণ' },
      { id: 'kanji',      en: 'Kanji',      bn: 'কাঞ্জি' },
      { id: 'reading',    en: 'Reading',    bn: 'পাঠ' },
      { id: 'listening',  en: 'Listening',  bn: 'শ্রবণ' },
      { id: 'practice',   en: 'Practice',   bn: 'অনুশীলন' }
    ];
    function numFromURL() {
      const p = new URLSearchParams(location.search);
      const v = p.get('lesson') || p.get('id') || '1';
      const n = parseInt(String(v).replace(/\D/g, ''), 10);
      return (n >= 1 && n <= 50) ? n : 1;
    }
    async function fetchJSON(url) {
      const r = await fetch(url, { cache: 'no-cache' });
      if (!r.ok) throw new Error(url);
      return r.json();
    }
    const jpMain = v => (v && v.kanji && v.furigana)
      ? `<ruby>${esc(v.kanji)}<rt>${esc(v.furigana)}</rt></ruby>`
      : esc((v && (v.furigana || v.kanji || v.romaji)) || '');
    function bilingual(en, bn) {
      const l = lang();
      return `<span data-en="${esc(en || '')}" data-bn="${esc(bn || en || '')}">${esc(l === 'bn' ? (bn || en || '') : (en || ''))}</span>`;
    }
    function audioTag(url) {
      if (!url) return '';
      return `<audio controls preload="none" src="${esc(url)}" style="margin-top:var(--s-2);width:100%"></audio>`;
    }
    function renderHead(m) {
      const t = (m && m.title) ? m.title : null;
      $('#lv-kicker').innerHTML = bilingual('Lesson ' + state.n, 'পাঠ ' + state.n);
      $('#lv-title').innerHTML = bilingual(t && t.en, t && t.bn);
      $('#lv-subtitle').textContent = (m && m.subtitle) ? (m.subtitle[lang()] || m.subtitle.en || '') : '';
      const b = [];
      if (m && m.jlpt) b.push(`<span class="badge badge--primary">${esc(m.jlpt)}</span>`);
      if (m && m.durationMin) b.push(`<span class="badge">${bilingual(m.durationMin + ' min', m.durationMin + ' মিনিট')}</span>`);
      const c = state.data;
      if ((c.vocabulary || []).length) b.push(`<span class="badge badge--accent">${bilingual(c.vocabulary.length + ' words', c.vocabulary.length + ' শব্দ')}</span>`);
      if ((c.grammar || []).length) b.push(`<span class="badge badge--success">${bilingual(c.grammar.length + ' grammar', c.grammar.length + ' ব্যাকরণ')}</span>`);
      $('#lv-badges').innerHTML = b.join('');
    }
    function renderTabs() {
      const el = $('#lv-tabs');
      el.innerHTML = TABS.filter(t => (state.data[t.id] || []).length).map(t => {
        const n = (state.data[t.id] || []).length;
        const active = state.tab === t.id;
        return `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${active}" tabindex="${active ? '0' : '-1'}">
          ${bilingual(t.en + ' (' + n + ')', t.bn + ' (' + n + ')')}
        </button>`;
      }).join('');
      el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
        state.tab = b.getAttribute('data-tab');
        if (window.Store) window.Store.setLessonSection(state.slug, { tab: state.tab });
        renderTabs(); renderPanel();
      }));
    }
    function renderVocab(list) {
      return '<div class="lv-list">' + list.map(v =>
        `<article class="lv-item">
           <p class="lv-jp">${jpMain(v)}</p>
           ${v.romaji ? `<p class="lv-romaji">${esc(v.romaji)}</p>` : ''}
           <p class="lv-meaning">${bilingual(v.english_meaning, v.bengali_meaning)}</p>
           ${audioTag(v.audio_url)}
           ${(v.tags || []).length ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${v.tags.map(t => `<span class="badge badge--outline">${esc(t)}</span>`).join('')}</div>` : ''}
         </article>`).join('') + '</div>';
    }
    function renderGrammar(list) {
      return '<div class="lv-list">' + list.map(g =>
        `<article class="lv-item">
           <p class="lv-grammar-pattern">${esc(g.pattern || '')}</p>
           <p class="lv-meaning">${bilingual(g.meaning_en, g.meaning_bn)}</p>
           ${(g.examples || []).length ? `<ul class="lv-examples">${g.examples.map(ex =>
             `<li>
                <p class="lv-jp" style="font-size:1rem">${esc(ex.jp || '')}</p>
                ${ex.furigana ? `<p class="lv-reading">${esc(ex.furigana)}</p>` : ''}
                ${ex.romaji ? `<p class="lv-romaji">${esc(ex.romaji)}</p>` : ''}
                <p class="lv-meaning lv-meaning--sm">${bilingual(ex.en, ex.bn)}</p>
                ${audioTag(ex.audio_url)}
              </li>`).join('')}</ul>` : ''}
         </article>`).join('') + '</div>';
    }
    function renderKanji(list) {
      return '<div class="lv-kanji-grid">' + list.map(k => {
        const m = k.meanings || {};
        return `<article class="lv-item lv-kanji">
           <p class="lv-kanji-char" lang="ja">${esc(k.character || '')}</p>
           <p class="lv-romaji">${bilingual('On: ' + (k.onyomi || []).join(' · '), 'অন: ' + (k.onyomi || []).join(' · '))}</p>
           <p class="lv-romaji">${bilingual('Kun: ' + (k.kunyomi || []).join(' · '), 'কুন: ' + (k.kunyomi || []).join(' · '))}</p>
           <p class="lv-meaning">${bilingual((m.en || []).join(', '), (m.bn || []).join(', '))}</p>
           <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
             ${k.strokes ? `<span class="badge badge--outline">${bilingual(k.strokes + ' strokes', k.strokes + ' স্ট্রোক')}</span>` : ''}
             ${k.jlpt ? `<span class="badge badge--primary">${esc(k.jlpt)}</span>` : ''}
           </div>
         </article>`;
      }).join('') + '</div>';
    }
    function renderReading(list) {
      return '<div class="lv-list">' + list.map((r, i) => {
        const title = r.title || {};
        const passage = Array.isArray(r.passage) ? r.passage
                      : (Array.isArray(r.lines) ? r.lines : []);
        return `<article class="lv-item">
          <p class="lv-grammar-pattern">${bilingual(title.en || ('Reading ' + (i + 1)), title.bn || ('পাঠ ' + (i + 1)))}</p>
          ${passage.map(line => `
            <div style="display:flex;flex-direction:column;gap:4px;margin-top:var(--s-2)">
              <p class="lv-jp">${esc(line.jp || line.text || '')}</p>
              ${line.furigana ? `<p class="lv-reading">${esc(line.furigana)}</p>` : ''}
              ${line.romaji ? `<p class="lv-romaji">${esc(line.romaji)}</p>` : ''}
              <p class="lv-meaning lv-meaning--sm">${bilingual(line.en, line.bn)}</p>
              ${audioTag(line.audio_url)}
            </div>`).join('')}
        </article>`;
      }).join('') + '</div>';
    }
    function renderListening(list) {
      return '<div class="lv-list">' + list.map((l, i) => {
        const title = l.title || {};
        const transcript = Array.isArray(l.transcript) ? l.transcript
                         : (Array.isArray(l.lines) ? l.lines : []);
        return `<article class="lv-item">
          <p class="lv-grammar-pattern">${bilingual(title.en || ('Listening ' + (i + 1)), title.bn || ('শ্রবণ ' + (i + 1)))}</p>
          ${audioTag(l.audio_url)}
          ${transcript.map(line => `
            <div style="display:flex;flex-direction:column;gap:4px;margin-top:var(--s-2)">
              <p class="lv-jp">${esc(line.jp || line.text || '')}</p>
              ${line.romaji ? `<p class="lv-romaji">${esc(line.romaji)}</p>` : ''}
              <p class="lv-meaning lv-meaning--sm">${bilingual(line.en, line.bn)}</p>
            </div>`).join('')}
        </article>`;
      }).join('') + '</div>';
    }
    function renderPractice(list) {
      return '<div class="lv-list">' + list.map((q, qi) => {
        const prompt = q.prompt || {};
        const stem = q.stem || {};
        const options = Array.isArray(q.options) ? q.options : [];
        const ci = (typeof q.correctIndex === 'number') ? q.correctIndex : -1;
        return `<article class="lv-item" data-q="${qi}">
          <p class="lv-grammar-pattern">${bilingual(prompt.en || ('Question ' + (qi + 1)), prompt.bn || ('প্রশ্ন ' + (qi + 1)))}</p>
          <p class="lv-jp">${esc(stem.jp || '')}</p>
          ${stem.romaji ? `<p class="lv-romaji">${esc(stem.romaji)}</p>` : ''}
          ${audioTag(stem.audio_url)}
          <div style="display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)">
            ${options.map((opt, oi) => {
              const optText = typeof opt === 'string' ? opt : (opt && (opt.text || opt.en)) || '';
              return `<button type="button" class="lp-btn lp-btn--secondary" data-opt="${oi}" data-correct="${oi === ci}" style="justify-content:flex-start;text-align:left">${esc(optText)}</button>`;
            }).join('')}
          </div>
          <p class="lv-meaning lv-meaning--sm" data-feedback hidden></p>
        </article>`;
      }).join('') + '</div>';
    }
    function attachPracticeHandlers() {
      document.querySelectorAll('.lv-item[data-q]').forEach(card => {
        const buttons = card.querySelectorAll('[data-opt]');
        const fb = card.querySelector('[data-feedback]');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            buttons.forEach(b => b.disabled = true);
            const ok = btn.getAttribute('data-correct') === 'true';
            btn.style.borderColor = ok ? 'var(--success)' : 'var(--danger)';
            btn.style.color = ok ? 'var(--success)' : 'var(--danger)';
            if (fb) {
              fb.hidden = false;
              fb.textContent = ok ? '✓ Correct' : '✗ Not correct';
              fb.style.color = ok ? 'var(--success)' : 'var(--danger)';
            }
          });
        });
      });
    }
    function renderPanel() {
      const list = state.data[state.tab] || [];
      const el = $('#lv-panel');
      if (!list.length) {
        el.innerHTML = `<p class="lv-empty">${bilingual('No content in this section yet.', 'এই অংশে এখনো কন্টেন্ট নেই।')}</p>`;
        return;
      }
      switch (state.tab) {
        case 'vocabulary': el.innerHTML = renderVocab(list); break;
        case 'grammar':    el.innerHTML = renderGrammar(list); break;
        case 'kanji':      el.innerHTML = renderKanji(list); break;
        case 'reading':    el.innerHTML = renderReading(list); break;
        case 'listening':  el.innerHTML = renderListening(list); break;
        case 'practice':   el.innerHTML = renderPractice(list); attachPracticeHandlers(); break;
      }
    }
    function renderNav(m) {
      const n = Number(m && m.lessonNumber) || state.n;
      const prev = n > 1 ? slug(n - 1) : null;
      const next = n < 50 ? slug(n + 1) : null;
      $('#lv-nav').innerHTML =
        (prev ? `<a class="btn btn--secondary" href="lesson.html?lesson=${prev}">${bilingual('← Previous', '← পূর্ববর্তী')}</a>` : '<span></span>') +
        (next ? `<a class="btn btn--primary" href="lesson.html?lesson=${next}">${bilingual('Next →', 'পরবর্তী →')}</a>` : '<span></span>');
    }
    async function boot() {
      state.n = numFromURL();
      state.slug = slug(state.n);
      state.data = {};
      $('#lv-panel').innerHTML = '<p class="lv-empty">Loading...</p>';
      try {
        let m = null;
        try { m = await fetchJSON('data/lessons/' + state.slug + '/manifest.json'); }
        catch (e) { m = {}; }
        state.data.manifest = m;
        for (const f of ['vocabulary', 'grammar', 'kanji', 'reading', 'listening', 'practice']) {
          try { state.data[f] = await fetchJSON('data/lessons/' + state.slug + '/' + f + '.json'); }
          catch (e) { state.data[f] = []; }
        }
        const saved = window.Store && window.Store.getLessonSection(state.slug);
        if (saved && saved.tab && (state.data[saved.tab] || []).length) {
          state.tab = saved.tab;
        } else if (!(state.data[state.tab] || []).length) {
          const first = TABS.find(t => (state.data[t.id] || []).length);
          if (first) state.tab = first.id;
        }
        renderHead(state.data.manifest);
        renderTabs();
        renderPanel();
        renderNav(state.data.manifest);
        if (window.I18n && typeof window.I18n.apply === 'function') {
          try { window.I18n.apply(window.I18n.get ? window.I18n.get() : undefined); } catch (e) {}
        }
      } catch (err) {
        console.error('[lesson-view]', err);
        $('#lv-panel').innerHTML = `<p class="lv-empty">${bilingual('This lesson is not available yet.', 'এই পাঠটি এখনো আসেনি।')}</p>`;
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
    else boot();
  </script>
</body>
</html>
