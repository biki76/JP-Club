<!DOCTYPE html>
<html lang="en" data-theme="light" data-furigana="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Offline · JP-Club</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('nihongo_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('nihongo_lang');
        document.documentElement.setAttribute('lang', l === 'bn' ? 'bn' : 'en');
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/a11y.css" />

  <style>
    /* Self-contained: every token has a fallback so the page still looks right
       even if a token is renamed or a stylesheet is missing from the cache. */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 20px;
      background: var(--bg, #fbfaf7);
      color: var(--ink, #15161a);
      font-family: var(--font-en, system-ui, sans-serif);
      line-height: var(--lh-en, 1.6);
    }
    html[lang="bn"] body { font-family: var(--font-bn, system-ui, sans-serif); line-height: var(--lh-bn, 1.85); }

    .offline-card {
      box-sizing: border-box;
      max-width: 460px;
      width: 100%;
      text-align: center;
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e5ea);
      border-radius: var(--r-lg, 20px);
      padding: 32px 24px;
      box-shadow: var(--shadow-md, 0 8px 24px rgba(0,0,0,.08));
    }
    .offline-icon {
      display: inline-flex;
      width: 64px;
      height: 64px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary, #5b5bf0) 12%, var(--surface, #fff));
      color: var(--primary, #5b5bf0);
      margin-bottom: 16px;
    }
    .offline-card h1 { font-size: var(--fs-2xl, 1.75rem); margin: 0 0 12px; }
    .offline-card p { color: var(--ink-muted, #5b5f6b); margin: 0 0 24px; }

    .offline-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .offline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: var(--r-md, 12px);
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .offline-btn--primary {
      background: var(--primary, #5b5bf0);
      color: #fff;
    }
    .offline-btn--secondary {
      background: transparent;
      color: var(--ink, #15161a);
      border-color: var(--border-strong, var(--border, #c9c9d1));
    }
    .offline-btn:focus-visible {
      outline: 2px solid var(--focus, #5b5bf0);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="offline-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>
      <span data-en="You're offline" data-bn="আপনি অফলাইনে আছেন">You're offline</span>
    </h1>
    <p>
      <span data-en="We couldn't reach the network. Lessons you've already opened are still available."
            data-bn="নেটওয়ার্কে পৌঁছানো যায়নি। আপনি আগে খোলা লেসন এখনও ব্যবহার করতে পারবেন।">
        We couldn't reach the network. Lessons you've already opened are still available.
      </span>
    </p>
    <div class="offline-actions">
      <button class="offline-btn offline-btn--primary" type="button" onclick="location.reload()">
        <span data-en="Try again" data-bn="আবার চেষ্টা করুন">Try again</span>
      </button>
      <a class="offline-btn offline-btn--secondary" href="home.html">
        <span data-en="Go to home" data-bn="হোমে যান">Go to home</span>
      </a>
    </div>
  </main>

  <script>
    // Show the right language (this page loads no shell/i18n scripts).
    (function () {
      var lang = document.documentElement.getAttribute('lang') === 'bn' ? 'bn' : 'en';
      document.querySelectorAll('[data-en]').forEach(function (el) {
        var v = el.getAttribute('data-' + lang);
        if (v) el.textContent = v;
      });
    })();

    // Auto-recover when the connection returns.
    window.addEventListener('online', function () {
      var target = document.referrer && document.referrer.indexOf(location.origin) === 0
        ? document.referrer
        : 'home.html';
      location.replace(target);
    });
  </script>
</body>
</html>
