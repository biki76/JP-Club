<!DOCTYPE html>
<html lang="en" data-theme="light" data-furigana="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flashcards · Nihongo</title>

  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('nihongo_theme');
        var f = localStorage.getItem('nihongo_furigana');
        var l = localStorage.getItem('nihongo_lang');
        if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);
        if (f === 'on' || f === 'off') root.setAttribute('data-furigana', f);
        if (l === 'en' || l === 'bn') root.setAttribute('lang', l);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/flashcards.css" />
</head>
<body class="shell-body">

  <header data-shell-header></header>

  <div class="shell-frame">
    <aside class="shell-sidebar" data-shell-sidebar></aside>
    <main class="shell-main">
      <div class="fc-page" id="fc-page">
        <div class="fc-loading">Loading…</div>
      </div>
    </main>
  </div>

  <nav class="shell-bottomnav" data-shell-bottomnav></nav>
  <footer class="shell-footer" data-shell-footer></footer>
  <aside class="shell-drawer" data-shell-drawer data-open="false"></aside>

  <script>
    window.SHELL_CONFIG = {
      navGroups: [
        {
          title: { en: 'Study', bn: 'অধ্যয়ন' },
          items: [
            { key: 'home',       icon: 'home',     href: 'home.html',       label: { en: 'Home',       bn: 'হোম' } },
            { key: 'flashcards', icon: 'practice', href: 'flashcards.html', label: { en: 'Flashcards', bn: 'ফ্ল্যাশকার্ড' } }
          ]
        }
      ],
      bottomNav: [
        { href: 'home.html',       icon: 'home',     label: { en: 'Home',  bn: 'হোম' } },
        { href: 'flashcards.html', icon: 'practice', label: { en: 'Cards', bn: 'কার্ড' } }
      ],
      searchEnabled: false
    };
  </script>
  <script src="js/data-schemas.js"></script>
  <script src="js/data-loader.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/srs.js" defer></script>
  <script src="js/flashcards.js" defer></script>
</body>
</html>
