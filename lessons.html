<!doctype html>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Pre-paint: theme, lang, furigana (no FOUC) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nihongo_theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        var l = localStorage.getItem('nihongo_lang');
        if (l === 'en') document.documentElement.setAttribute('lang', 'en');
        else if (l === 'bn') document.documentElement.setAttribute('lang', 'bn');
        var f = localStorage.getItem('nihongo_furigana');
        if (f === 'off') document.documentElement.setAttribute('data-furigana', 'off');
        else if (f === 'on') document.documentElement.setAttribute('data-furigana', 'on');
      } catch (e) {}
    })();
  </script>
